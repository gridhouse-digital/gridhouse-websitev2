    <meta name="description" content="Gridhouse Digital builds AI-native operational systems for regulated and workflow-heavy businesses." />
    <meta name="robots" content="index,follow" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:site_name" content="Gridhouse Digital" />
    <meta property="og:title" content="Gridhouse Digital: AI-Native Operational Systems" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://gridhouse.digital" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply persisted theme before first paint to avoid a flash
      try {
        if (localStorage.getItem("gh-theme") === "light") {
          document.documentElement.classList.add("theme-light");
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", "#F4F3ED");
        }
      } catch (e) {}
    </script>
    <title>Gridhouse Digital: AI-Native Operational Systems</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "ProfessionalService"],
        "name": "Gridhouse Digital",
        "url": "https://gridhouse.digital",
        "email": "hello@gridhouse.digital",
        "areaServed": "Worldwide",
        "address": { "@type": "PostalAddress", "addressCountry": "CA" }
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
