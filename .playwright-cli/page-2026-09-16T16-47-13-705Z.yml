        - generic [ref=f4e41]: MISSION / 01
        - heading "Move teams from manual work to designed systems." [level=2] [ref=f4e43]
      - generic [ref=f4e44]:
        - paragraph [ref=f4e45]: "We work with healthcare agencies, professional services, and ops-heavy SMBs. The pattern is consistent: spreadsheets and email chains where there should be platforms; ad-hoc compliance where there should be auditable systems; AI tools deployed as novelties when they could be quietly absorbing the operational load."
        - paragraph [ref=f4e46]: Gridhouse exists to engineer that transition — and to do it quickly enough that the operator can feel the difference within a quarter, not a year.
    - generic [ref=f4e48]:
      - generic [ref=f4e49]:
        - generic [ref=f4e50]: OPERATING PRINCIPLES / 02
        - heading "Five principles, applied every engagement." [level=2] [ref=f4e52]
      - generic [ref=f4e53]:
        - article [ref=f4e54]:
          - generic [ref=f4e55]: / 01
          - heading "System before decoration" [level=3] [ref=f4e57]
          - paragraph [ref=f4e58]: Architecture and operating logic are decided first — surfaces follow the system, not the other way around.
        - article [ref=f4e59]:
          - generic [ref=f4e60]: / 02
          - heading "Automation before repetition" [level=3] [ref=f4e62]
          - paragraph [ref=f4e63]: If the same step happens twice, it becomes a candidate for an automation, an agent, or a deletion.
        - article [ref=f4e64]:
          - generic [ref=f4e65]: / 03
          - heading "Clarity before complexity" [level=3] [ref=f4e67]
          - paragraph [ref=f4e68]: Operators don't have time for clever; they need legible interfaces and predictable behavior.
        - article [ref=f4e69]:
          - generic [ref=f4e70]: / 04
          - heading "Compliance-aware by default" [level=3] [ref=f4e72]
          - paragraph [ref=f4e73]: Healthcare clients live and die on audit readiness. Access, retention, logging — never an afterthought.
        - article [ref=f4e74]:
          - generic [ref=f4e75]: / 05
          - heading "Build for operators, not just visitors" [level=3] [ref=f4e77]
          - paragraph [ref=f4e78]: Marketing surfaces matter; operating systems matter more. We build for the people running the work.
